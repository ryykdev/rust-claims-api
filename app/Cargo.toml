[package]
name = "rust-claims-api"
version = "0.1.0"
edition = "2024"

[dependencies]

# tools
rust_decimal = { version="1.43.0", features=["macros"] } 
chrono = "0.4.45"
serde = { version = "1.0", features = ["derive"] }
derive_more = "2.1.1"
env_logger = "0.11.11"
log = "0.4.34"

#server
actix-web = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# db
  sqlx = { version = "0.9", features = [
    "postgres",
    "runtime-tokio",
    "tls-native-tls",
    "chrono",
    "rust_decimal",
    "migrate",
  ] }

# ingestion
quick-xml = { version = "0.42", features = ["serialize", "async-tokio"] }

# parsing
strum = "0.28.0" 
strum_macros = "0.28.0"
encoding_rs = "0.8.42"
