services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: challenge
      POSTGRES_DB: challenge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U challenge -d challenge"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - dbdata:/var/lib/postgresql/data

  app:
    build: ./app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://challenge:challenge@db:5432/challenge
    # example mapping; adjust freely if your service uses another port
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro

volumes:
  dbdata:
